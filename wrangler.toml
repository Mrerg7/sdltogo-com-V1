name = "sdltogo-com-v1"
main = "./worker/index.ts"
compatibility_date = "2026-09-07"
workers_dev = false
preview_urls = false

# Serve the canonical apex and www so the Worker can 301 www → apex.
[[routes]]
pattern = "sdltogo.com"
custom_domain = true

[[routes]]
pattern = "www.sdltogo.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[observability]
enabled = true
